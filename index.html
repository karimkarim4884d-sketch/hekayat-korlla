<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عالم ذكرياتنا ✨</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0914; color: #f3f4f6; min-height: 100vh; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; }
    
    header { text-align: center; margin: 30px 0; }
    header h1 { color: #ff3b5c; font-size: 28px; margin-bottom: 8px; }
    header p { color: #a1a1aa; font-size: 14px; }

    .feed { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
    
    .post-card { background: #161022; border: 1px solid #271e38; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .post-card img { width: 100%; border-radius: 12px; margin-bottom: 15px; object-fit: cover; max-height: 300px; }
    .post-card .date { font-size: 12px; color: #ff3b5c; margin-bottom: 8px; font-weight: bold; }
    .post-card .title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #fff; }
    .post-card .text { font-size: 15px; color: #d1d5db; line-height: 1.6; white-space: pre-line; margin-bottom: 15px; }
    .post-card audio { width: 100%; border-radius: 30px; height: 35px; }

    .closed-card { background: #161022; padding: 40px 20px; border-radius: 20px; text-align: center; border: 1px solid #271e38; margin-top: 50px; }
    .closed-card .icon { font-size: 50px; margin-bottom: 15px; }
    .closed-card h2 { color: #fff; font-size: 22px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="active-site" class="feed">
    <header>
      <h1>أجمل الذكريات ❤️</h1>
      <p>كل لحظة حلوة توثقت هنا...</p>
    </header>
    <div id="posts-container"></div>
  </div>

  <div id="closed-site" class="closed-card hidden">
    <div class="icon">🔒</div>
    <h2>هذا اللينك غير متاح الان 🔒</h2>
  </div>

  <script>
    function render() {
      const isSiteActive = localStorage.getItem('memories_site_active') !== 'false';
      
      if (!isSiteActive) {
        document.getElementById('active-site').classList.add('hidden');
        document.getElementById('closed-site').classList.remove('hidden');
        return;
      }

      const postsContainer = document.getElementById('posts-container');
      const posts = JSON.parse(localStorage.getItem('memories_posts') || '[]');

      if (posts.length === 0) {
        postsContainer.innerHTML = `<p style="text-align:center; color:#71717a;">لا توجد ذكريات مضافة حتى الآن ✨</p>`;
        return;
      }

      postsContainer.innerHTML = posts.map(post => `
        <div class="post-card">
          ${post.image ? `<img src="${post.image}" alt="ذكرى">` : ''}
          <div class="date">${post.date}</div>
          <div class="title">${post.title}</div>
          <div class="text">${post.text}</div>
          ${post.audio ? `<audio controls src="${post.audio}"></audio>` : ''}
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
