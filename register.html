<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل وكيل</title>

<link rel="stylesheet" href="style.css">

<style>
.form{
max-width:450px;
margin:auto;
background:#1e293b;
padding:20px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.back{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}
</style>

</head>

<body>

<div class="form">

<h2 style="color:white;text-align:center;">تسجيل وكيل</h2>

<input id="bd" type="text" placeholder="BD ID">

<input id="agent" type="text" placeholder="ID الوكيل">

<input id="name" type="text" placeholder="اسم الوكيل">

<button onclick="saveAgent()">
حفظ الوكيل
</button>

<a href="index.html" class="back">
⬅ العودة للرئيسية
</a>

</div>

<script>
function saveAgent(){

let bd=document.getElementById("bd").value;
let agent=document.getElementById("agent").value;
let name=document.getElementById("name").value;

if(bd==""||agent==""||name==""){
alert("اكتب جميع البيانات");
return;
}

alert("تم حفظ الوكيل (سيتم ربط Firebase في الخطوة التالية)");

}
</script>

</body>
</html>
