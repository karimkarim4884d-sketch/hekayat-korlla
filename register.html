<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل وكيل</title>

<link rel="stylesheet" href="style.css">

<style>
.form{
max-width:450px;
margin:40px auto;
background:#1e293b;
padding:20px;
border-radius:15px;
}

h2{
color:white;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.back{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}
</style>

</head>

<body>

<div class="form">

<h2>تسجيل وكيل</h2>

<input id="bd" placeholder="BD ID">

<input id="agent" placeholder="ID الوكيل">

<input id="name" placeholder="اسم الوكيل">

<button id="saveBtn">حفظ الوكيل</button>

<a href="index.html" class="back">⬅ العودة للرئيسية</a>

</div>


<script type="module">

import { db } from "./firebase.js";

import { ref, push }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";


document.getElementById("saveBtn").onclick = async ()=>{

let bd = document.getElementById("bd").value;
let agent = document.getElementById("agent").value;
let name = document.getElementById("name").value;


if(!bd || !agent || !name){

alert("اكتب جميع البيانات");
return;

}


try{

await push(ref(db,"agents"),{

bd: bd,
agent: agent,
name: name,
time: new Date().toLocaleString()

});


alert("✅ تم حفظ الوكيل");


}catch(e){

alert("❌ خطأ: " + e.message);

}


};

</script>


</body>
</html>
